# pnpm 11+ reads settings from this file, not from the "pnpm" field in package.json
# See https://pnpm.io/settings
packages:
  # Root package (the Next.js app) is always included.
  # Explicitly include the mcp-server sub-project so pnpm installs its deps.
  - 'mcp-server'

allowBuilds:
  # Next.js SWC compiler — required for next build/dev
  '@swc/core': true
  # Image processing (next/image) — required for production builds
  sharp: true
  # File watcher used by dev tooling
  '@parcel/watcher': true
  # Resolver used by eslint-import-resolver / tailwind tooling
  unrs-resolver: true
  # esbuild — native binary used by build:god (god.js bundle)
  esbuild: true

# HEIF Heist (CVE-2026-84383, GHSA-g89c-p67h-r497): sharp <0.35.4 bundles
# libheif <1.23.2 — heap overflow decoding HEIF/HEIC/AVIF via next/image.
# pnpm 11 ignores the npm-style "overrides" in package.json; they live here.
# https://pnpm.io/cli/audit
overrides:
  sharp: "^0.35.4"
